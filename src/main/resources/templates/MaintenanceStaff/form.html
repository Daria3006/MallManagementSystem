<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New MaintenanceStaff</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New MaintenanceStaff</h1>

<form th:action="@{/staff/maintenanceStaff}" th:object="${maintenanceStaff}" method="post">

    <div class="form-group">
        <label for="id">MaintenanceStaff ID:</label>
        <select id="id" th:field="*{id}" required>
            <option th:each="maintenanceStaffId : ${maintenanceStaffIds}" th:value="${maintenanceStaffId}" th:text="${maintenanceStaffId}"></option>
        </select>
    </div>

    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required />
    </div>


    <div class="form-group">
        <label for="type">Type:</label>
        <select id="type" th:field="*{type}" required>
            <option value="ELECTRICAL">ELECTRICAL</option>
            <option value="CLEANING">CLEANING</option>
        </select>
    </div>

    <button type="submit">Save MaintenanceStaff</button>
    <a th:href="@{/staff/maintenanceStaff}">Cancel</a>
</form>
</body>
</html>
