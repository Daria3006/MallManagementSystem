<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <title>Shops</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .actions {
            display: flex;
            gap: 10px
        }

        .compact-list { margin: 0; padding-left: 18px; }
        .compact-list li { margin: 2px 0; font-size: 14px; color: #334155; }

        .error-message {
            color: #D8000C;
            background-color: #FFBABA;
            border: 1px solid #D8000C;
            padding: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<h1>Shops</h1>

<a th:href="@{/sales/shops/new}">
    <button>Create New Shop</button>
</a>

<div th:if="${errorMessage != null}" class="error-message">
    <span th:text="${errorMessage}"></span>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Owner Name</th>
        <th>Area</th>
        <th>Floor ID</th>
        <th>Purchases</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="shop : ${shops}">
        <td th:text="${shop.id}">ID</td>
        <td th:text="${shop.name}">Name</td>
        <td th:text="${shop.ownerName}">Owner Name</td>
        <td th:text="${shop.areaSqm}">Area</td>
        <td th:text="${shop.floorId}">Floor ID</td>
        <td>
            <ul class="compact-list">
                <li th:each="purchase : ${shop.purchases}" th:text="${purchase.id}"></li>
            </ul>
        </td>
        <td>
            <form th:action="@{'/sales/shops/'+${shop.id}+'/delete'}" method="post" style="margin: 0;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(shops)}">
        <td colspan="7" style="text-align: center;">No Shops found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
