<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <title>Create new Shop</title>
    <style>
        .form-group{margin-bottom: 15px;}
        label{display: block;margin-bottom: 5px; font-weight: bold;}
        input[type="text"],input[type="number"]{width: 300px;padding:5px;}
    </style>
</head>
<body>
<h1>Create new Shop</h1>
<form th:action="@{/sales/shops}" th:object="${shop}" method="post">
    <div class="form-group">
        <label for="id">Shop ID</label>
        <input type="text" id="id" th:field="*{id}" required>
    </div>

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label for="ownerName">Owner Name</label>
        <input type="text" id="ownerName" th:field="*{ownerName}" required>
    </div>

    <div class="form-group">
        <label for="areaSqm">Area sqm</label>
        <input type="number" id="areaSqm" th:field="*{areaSqm}" step="any" required />
    </div>

    <button type="submit">Submit</button>
    <a th:href="@{/sales/shops}">Cancel</a>
</form>
</body>
</html>
