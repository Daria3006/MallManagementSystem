<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Floor</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New Floor</h1>

<form th:action="@{/structure/floors}" th:object="${floor}" method="post">

    <div class="form-group">
        <label for="id">Floor ID:</label>
        <input type="text" id="id" th:field="*{id}" required />
    </div>

    <div class="form-group">
        <label for="number">Floor Number:</label>
        <input type="number" id="number" th:field="*{number}" required />
    </div>

    <button type="submit">Save Floor</button>
    <a th:href="@{/structure/floors}">Cancel</a>
</form>
</body>
</html>
