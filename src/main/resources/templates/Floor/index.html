<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Floor List</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .actions{display: flex;gap: 10px}

        .error-message {
            color: #D8000C;
            background-color: #FFBABA;
            border: 1px solid #D8000C;
            padding: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<h1>Floors</h1>

<a th:href="@{/structure/floors/new}">
    <button>Create New Floor</button>
</a>
<div th:if="${errorMessage != null}" class="error-message">
    <span th:text="${errorMessage}"></span>
</div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Floor Number</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="floor : ${floors}">
        <td th:text="${floor.id}">ID</td>
        <td th:text="${floor.number}">Number</td>
        <td>
            <form th:action="@{'/structure/floors/' + ${floor.id} + '/delete'}" method="post" style="margin: 0;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(floors)}">
        <td colspan="4" style="text-align: center;">No Floors found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
