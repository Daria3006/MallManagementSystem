<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
    <style>
        table{width: 100%; border-collapse: collapse; margin-top: 20px;}
        th,td{border:1px solid #ddd;padding: 8px;text-align: left;}
        th{background-color: #f2f2f2;}
        .actions{display: flex;gap: 10px}
    </style>
</head>
<body>
<h1>Customer</h1>
<a th:href="@{/sales/customers/new}">
    <button>Create new Customers</button>
</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Currency</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.id}">ID</td>
        <td th:text="${customer.name}">Name</td>
        <td th:text="${customer.currency}">Currency</td>
        <td th:text="${customer.email}">Email</td>
        <td>
            <form th:action="@{'/sales/customers/'+${customer.id}+'/delete'}" method="post" style="margin: 0;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(customers)}">
        <td colspan="5" style="text-align: center;">No Customer found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
