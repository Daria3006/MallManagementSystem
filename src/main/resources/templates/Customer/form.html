<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Customer</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New Customer</h1>

<form th:action="@{/sales/customers}" th:object="${customer}" method="post">
    <div class="form-group">
        <label for="id">Customer ID:</label>
        <input type="text" id="id" th:field="*{id}" required/>
    </div>

    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required/>
    </div>

    <div class="form-group">
        <label for="currency">Currency:</label>
        <input type="text" id="currency" th:field="*{currency}" required/>
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="text" id="email" th:field="*{email}" required/>
    </div>

    <button type="submit">Submit</button>
    <a th:href="@{/sales/customers}">Cancel</a>
</form>
</body>
</html>
