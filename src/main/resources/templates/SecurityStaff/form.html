<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New SecurityStaff</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New SecurityStaff</h1>

<form th:action="@{/staff/securityStaff}" th:object="${securityStaff}" method="post">

    <div class="form-group">
        <label for="id">SecurityStaff ID:</label>
        <input type="text" id="id" th:field="*{id}" required />
    </div>

    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required />
    </div>

    <div class="form-group">
        <label for="badgeNo">BadgeNo:</label>
        <input type="text" id="badgeNo" th:field="*{badgeNo}" required />
    </div>

    <button type="submit">Save SecurityStaff</button>
    <a th:href="@{/staff/securityStaff}">Cancel</a>
</form>
</body>
</html>
