<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New MaintenanceTask</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New MaintenanceTask</h1>

<form th:action="@{/maintenance/maintenanceTask}" th:object="${maintenanceTask}" method="post">

    <div class="form-group">
        <label for="id">MaintenanceTask ID:</label>
        <input type="text" id="id" th:field="*{id}" required />
    </div>

    <div class="form-group">
        <label for="description">Description:</label>
        <input type="text" id="description" th:field="*{description}" required />
    </div>

    <div class="form-group">
        <label for="status">Status:</label>
        <select type="text" id="status" th:field="*{status}" required>
        <option value="ACTIVE">ACTIVE</option>
        <option value="PLANNED">PLANNED</option>
        <option value="DONE">DONE</option>
        </select>
    </div>

    <div class="form-group">
        <label for="assignmentId">AssignmentId:</label>
        <input type="text" id="assignmentId" th:field="*{assignmentId}" required />
    </div>

    <button type="submit">Save MaintenanceTasks</button>
    <a th:href="@{/maintenance/maintenanceTask}">Cancel</a>
</form>
</body>
</html>
