<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New MaintenanceTask</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New MaintenanceTask</h1>

<form th:action="@{/maintenance/maintenanceTasks}" th:object="${maintenanceTask}" method="post">

    <div class="form-group">
        <label for="id">MaintenanceTask ID:</label>
        <select id="id" th:field="*{id}" required>
        <option th:each="maintenanceTaskId : ${maintenanceTaskIds}" th:value="${maintenanceTaskId}" th:text="${maintenanceTaskId}"></option>
        </select>
    </div>

    <div class="form-group">
        <label for="description">Description:</label>
        <input type="text" id="description" th:field="*{description}" required />
    </div>

    <div class="form-group">
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}" required>
        <option value="ACTIVE">ACTIVE</option>
        <option value="PLANNED">PLANNED</option>
        <option value="DONE">DONE</option>
        </select>
    </div>

    <div class="form-group">
        <label for="assignmentId">AssignmentId:</label>
        <select id="assignmentId" th:field="*{assignmentId}" required>
            <option th:unless="${#lists.isEmpty(staffAssignmentsIds)}" th:each="staffAssignmentId : ${staffAssignmentsIds}" th:value="${staffAssignmentId}" th:text="${staffAssignmentId}"></option>
        </select>
    </div>

    <div th:if="${#lists.isEmpty(staffAssignmentsIds)}" class="text-danger">
        No StaffAssignment available. You cannot create this object.
    </div>

    <button type="submit" th:disabled="${#lists.isEmpty(staffAssignmentsIds)}">Save MaintenanceTasks</button>
    <a th:href="@{/maintenance/maintenanceTasks}">Cancel</a>
</form>
</body>
</html>
