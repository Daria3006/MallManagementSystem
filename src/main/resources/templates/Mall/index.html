<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mall List</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .actions { display: flex; gap: 10px; }
        .compact-list { margin: 0; padding-left: 18px; }
        .compact-list li { margin: 2px 0; font-size: 14px; color: #334155; }

        .error-message {
            color: #D8000C;
            background-color: #FFBABA;
            border: 1px solid #D8000C;
            padding: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<h1>Malls</h1>

<a th:href="@{/structure/malls/new}">
    <button>Create New Mall</button>
</a>
<div th:if="${errorMessage != null}" class="error-message">
    <span th:text="${errorMessage}"></span>
</div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>City</th>
        <th>Street</th>
        <th>Number</th>
        <th>Floors</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mall : ${malls}">
        <td th:text="${mall.id}">ID</td>
        <td th:text="${mall.name}">Name</td>
        <td th:text="${mall.city}">City</td>
        <td th:text="${mall.street}">Street</td>
        <td th:text="${mall.number}">Number</td>
        <td>
            <ul class="compact-list">
                <li th:each="floor : ${mall.floors}" th:text="${floor.id}"></li>
            </ul>
        </td>
        <td>
            <form th:action="@{'/structure/malls/' + ${mall.id} + '/delete'}" method="post" style="margin: 0;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(malls)}">
        <td colspan="7" style="text-align: center;">No Malls found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
