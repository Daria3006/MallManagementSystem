<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New StaffAssignment</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New StaffAssignment</h1>

<form th:action="@{/staff/staffAssignments}" th:object="${staffAssignment}" method="post">

    <div class="form-group">
        <label for="id">StaffAssignment ID:</label>
        <select id="id" th:field="*{id}" required>
            <option th:each="staffAssignmentId : ${staffAssignmentsIds}" th:value="${staffAssignmentId}" th:text="${staffAssignmentId}"></option>
        </select>
    </div>

    <div class="form-group">
        <label for="floorId">Floor ID:</label>
        <input type="text" id="floorId" th:field="*{floorId}" required />
    </div>

    <div class="form-group">
        <label for="staffId">Staff ID:</label>
        <select id="staffId" th:field="*{staffId}" required>
            <option th:unless="${#lists.isEmpty(maintenanceStaffIds)}" th:each="maintenanceStaffId : ${maintenanceStaffIds}" th:value="${maintenanceStaffId}" th:text="${maintenanceStaffId}"></option>
        </select>
    </div>

    <div th:if="${#lists.isEmpty(maintenanceStaffIds)}" class="text-danger">
        No MaintenanceStaff available. You cannot create this object.
    </div>


    <div class="form-group">
        <label for="shift">Shift:</label>
        <select id="shift" th:field="*{shift}" required>
            <option value="MORNING">MORNING</option>
            <option value="EVENING">EVENING</option>
            <option value="NIGHT">NIGHT</option>
        </select>
    </div>

    <button type="submit" th:disabled="${#lists.isEmpty(maintenanceStaffIds)}">Save StaffAssignment</button>
    <a th:href="@{/staff/staffAssignments}">Cancel</a>
</form>
</body>
</html>
