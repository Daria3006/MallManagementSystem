<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New ElectricalAsset</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 5px; }
    </style>
</head>
<body>
<h1>Create New ElectricalAsset</h1>

<form th:action="@{/maintenance/electricalAssets}" th:object="${electricalAsset}" method="post">

    <div class="form-group">
        <label for="id">ElectricalAsset ID:</label>
        <input type="text" id="id" th:field="*{id}" required />
    </div>

    <div class="form-group">
        <label for="floorId">Floor ID:</label>
        <input type="text" id="floorId" th:field="*{floorId}" required />
    </div>

    <div class="form-group">
        <label for="type">Type:</label>
        <select type="text" id="type" th:field="*{type}" required>
            <option value="LIFT">LIFT</option>
            <option value="AC">AC</option>
            <option value="LIGHT">LIGHT</option>
            <option value="ESCALATOR">ESCALATOR</option>
        </select>
    </div>

    <div class="form-group">
        <label for="status">Status:</label>
        <select type="text" id="status" th:field="*{status}" required>
            <option value="WORKING">WORKING</option>
            <option value="DOWN">DOWN</option>
        </select>
    </div>

    <button type="submit">Save ElectricalAssets</button>
    <a th:href="@{/maintenance/electricalAssets}">Cancel</a>
</form>
</body>
</html>
